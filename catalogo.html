        // tornillo de forma numérica en vez de alfabética.
        function parseTagForSort(tag) {
            if (!tag) return [];
            const tokens = String(tag).match(/\d+\/\d+|\d+(?:\.\d+)?/g) || [];
            return tokens.map(t => t.includes('/') ? fractionToDecimal(t) : parseFloat(t));
        }

        // Compara dos etiquetas de medida componente por componente (calibre,
        // luego largo, etc.), como se ordenarían en un tiquete: de menor a
        // mayor tamaño.
        function compareTagsForSort(tagA, tagB) {
            const a = parseTagForSort(tagA);
            const b = parseTagForSort(tagB);
            const len = Math.max(a.length, b.length);
            for (let i = 0; i < len; i++) {
                const av = a[i] !== undefined ? a[i] : 0;
                const bv = b[i] !== undefined ? b[i] : 0;
                if (av !== bv) return av - bv;
            }
            return 0;
        }

        // Extraer subcategoría de la primera (o primeras) palabra(s) del nombre del producto
        function extractSubcategoryFromName(description, category) {
            if (!description) return "General";
            const words = description.trim().split(/\s+/).filter(Boolean);
            if (words.length === 0) return "General";

            // Capitaliza cada palabra: primera letra mayúscula, resto minúsculas
            const capitalize = (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();

            // Para la categoría "TORNILLOS Y FIJACIONES" se usan las dos primeras
            // palabras del nombre del producto como subcategoría, excepto
            // para "CLAVOS" "GANCHO" "TARUGOS", que no necesitan esa subdivisión,
            // y para "TUERCA HEX" y "TOR HEX", que usan las tres primeras palabras
            const isTornillosYFijaciones = String(category || "").trim().toUpperCase() === "TORNILLOS Y FIJACIONES";
            const firstWordUpper = words[0].toUpperCase();
            const secondWordUpper = (words[1] || "").toUpperCase();
            const isSinSubdivision = firstWordUpper.startsWith("CLAVO") || firstWordUpper.startsWith("GANCHO") || firstWordUpper.startsWith("TARUGO");
            const isTuercaHex = firstWordUpper.startsWith("TUERCA") && secondWordUpper.startsWith("HEX");
            const isTorHex = firstWordUpper.startsWith("TOR") && secondWordUpper.startsWith("HEX");
            // NOTA: la lógica de "última palabra descriptiva -> tomar el valor
            // numérico anterior" para la etiqueta de tamaño se maneja en
            // getLastWordTag() (aplica a TORNILLOS Y FIJACIONES y PLOMERÍA).
            // Esta función (extractSubcategoryFromName) solo decide cómo se
            // agrupan los productos en subcategorías (por nombre), no la
            // etiqueta de tamaño individual de cada producto.
            if (isTornillosYFijaciones && (isTuercaHex || isTorHex)) {
                return words.slice(0, 3).map(capitalize).join(" ");
            }
            if (isTornillosYFijaciones && !isSinSubdivision && words.length > 1) {
                return `${capitalize(words[0])} ${capitalize(words[1])}`;
            }

            return capitalize(words[0]);
        }

        // Procesar productos
        function processProducts(products) {
            productList = products.map((product) => {
                const description = product.Description || product.Nombre || product.nombre || product.Descripcion || "";
                const category = product.Category || product.Categoria || product.categoria || "Sin Categoría";
                let subcategory = product.Subcategory || product.Subcategoria || product.subcategoria || "";
                
                // Si no hay subcategoría o es "General", usar la(s) primera(s) palabra(s) del nombre
                if (!subcategory || subcategory.trim() === "" || subcategory === "General") {
                    subcategory = extractSubcategoryFromName(description, category);
                }
                
                // Campo "Impuesto" del Excel: 7 = incluye 7% de ITBMS, 0 = exento.
                // Si el Excel no trae el dato para este producto, se asume 7
                // (gravado) por defecto.
                let impuestoRaw = product.Impuesto;
                if (impuestoRaw === undefined || impuestoRaw === null || impuestoRaw === "") {
                    impuestoRaw = product.impuesto;
                }
                if (impuestoRaw === undefined || impuestoRaw === null || impuestoRaw === "") {
                    impuestoRaw = 7;
                }

                return {
                    Code: product.Code || product.CodBarra || "",
                    // Referencia del producto (igual que en index). No se muestra en pantalla,
                    // solo se usa para poder buscarla en la barra de búsqueda.
                    Reference: (product.Reference || product.Referencia || product.referencia || product.Ref || product.ref || product.REF || "").toString(),
                    Description: description,
                    Category: category,
                    Subcategory: subcategory,
                    Brand: product.Brand || product.Marca || product.marca || "Sin Marca",
                    Cost: parseFloat(product.Cost || product.Costo || product.costo || product.Compra || 0),
                    Price: parseFloat(product.Price || product.Precio || product.precio || product.PrecioVenta || product.Precio1 || product["Precio 1"] || product["precio 1"] || 0),
                    Impuesto: parseFloat(impuestoRaw)
                };
            });

            localStorage.setItem("productList", JSON.stringify(productList));
            sortProductList();
            populateFilters();
            filterProducts();
            renderFeaturedProducts();
            showNotification(`Se cargaron ${productList.length} productos correctamente`);
        }
        //product.Codigo || product.codigo ||

        // Extraer marca del nombre del producto
        function extractBrandFromName(description) {
            if (!description) return "Sin Marca";
            // Tomar la primera palabra del nombre como marca
            const words = description.trim().split(/\s+/);
            if (words.length > 0) {
                return words[0].toUpperCase();
            }
            return "Sin Marca";
        }

        // Obtener marca del producto (se guarda en caché en el propio producto
        // la primera vez, para no repetir el cálculo en cada filtrado; esto es
        // lo que más se nota al elegir "Todas las categorías", donde se
        // recorre el catálogo completo en vez de un subconjunto pequeño).
        function getProductBrand(product) {
            if (product._brand !== undefined) return product._brand;
            product._brand = (product.Brand && product.Brand !== "Sin Marca" && product.Brand.trim() !== "")
                ? product.Brand
                : extractBrandFromName(product.Description);
            return product._brand;
        }

        // Convierte una subcategoría a valor numérico si es un número simple
        // o una medida en pulgadas con fracción, por ejemplo:
        //   "80"        -> 80
        //   "100"       -> 100
        //   "1/2"       -> 0.5
        //   "2-1/2"     -> 2.5
        //   "2 1/2"     -> 2.5
        // Puede llevar símbolo de pulgada u otro texto pegado al final (se ignora).
        // Devuelve null si no se pudo interpretar como número.
        function parseSubcategoryNumber(value) {
            const str = String(value).trim();

            // Entero y fracción, ej: "2-1/2", "2 1/2", "2-1/2 PLG", "2-1/2-INOX"
            // (se revisa antes que el entero simple para no confundir el "2" inicial)
            let match = str.match(/^(\d+)[\s-](\d+)\/(\d+)/);
            if (match) {
                const whole = parseFloat(match[1]);
                const num = parseFloat(match[2]);
                const den = parseFloat(match[3]);
                if (den !== 0) return whole + (num / den);
            }

            // Solo fracción, ej: "1/2", "3/4", "1/2 PLG", "1/2-INOX"
            // (se revisa antes que el entero simple para no confundir el "1" inicial)
            match = str.match(/^(\d+)\/(\d+)/);
            if (match) {
                const num = parseFloat(match[1]);
                const den = parseFloat(match[2]);
                if (den !== 0) return num / den;
            }

            // Entero o decimal simple, ej: "80", "100", "2.5", "1", "1-INOX"
            match = str.match(/^(\d+(?:\.\d+)?)/);
            if (match) return parseFloat(match[1]);

            return null;
        }

        // Extrae el prefijo (texto o símbolo) y el número que le sigue, ej:
        //   "#6"   -> { prefix: "#", num: 6 }
        //   "#10"  -> { prefix: "#", num: 10 }
        //   "M6"   -> { prefix: "M", num: 6 }
        //   "M10"  -> { prefix: "M", num: 10 }
        // Devuelve null si no hay un número en el valor.
        function parseSubcategoryPrefixedNumber(value) {
            const str = String(value).trim();
            const match = str.match(/^(\D*)(\d+(?:\.\d+)?)/);
            if (match) {
                return { prefix: match[1], num: parseFloat(match[2]) };
            }
            return null;
        }

        // Igual que parseSubcategoryNumber, pero además devuelve cuántos
        // caracteres del inicio del texto ocupa el número reconocido, para
        // poder quitarlo y seguir comparando el resto de la etiqueta.
        // Se usa para etiquetas de tornillos con varios números seguidos,
        // por ejemplo "6-9X1" (calibre #6 - 9 hilos X 1" de largo) o
        // "8-9X2-1/2": el primer número (6, 8...) NO es milimétrico, es un
        // calibre en pulgadas (#6, #8...), y tras él vienen más números
        // (hilos, largo) que también hay que comparar para ordenar bien.
        function parseLeadingSubcategoryToken(value) {
            const str = String(value).trim();

            // Entero y fracción, ej: "2-1/2", "2 1/2"
            let match = str.match(/^(\d+)[\s-](\d+)\/(\d+)/);
            if (match) {
                const whole = parseFloat(match[1]);
                const num = parseFloat(match[2]);
                const den = parseFloat(match[3]);
                if (den !== 0) return { value: whole + (num / den), length: match[0].length };
            }

            // Solo fracción, ej: "1/2", "3/4"
            match = str.match(/^(\d+)\/(\d+)/);
            if (match) {
                const num = parseFloat(match[1]);
                const den = parseFloat(match[2]);
                if (den !== 0) return { value: num / den, length: match[0].length };
            }

            // Entero o decimal simple, ej: "80", "100", "2.5", "6", "14"
            match = str.match(/^(\d+(?:\.\d+)?)/);
            if (match) return { value: parseFloat(match[1]), length: match[0].length };

            return null;
        }

        // Comparador para subcategorías y etiquetas: si ambos valores son
        // numéricos (incluyendo medidas en pulgadas con fracción como 2-1/2)
        // los compara como números (para que 80 quede antes que 100, y 2-1/2
        // no quede antes que 2). Si tras comparar el primer número ambos
        // valores empatan (por ejemplo "6-9X1" y "6-18X1" empiezan igual en
        // "6", o "6-9X1" y "6-9X3/4" empiezan igual en "6-9"), en vez de
        // darlos por iguales se sigue comparando el resto de la etiqueta
        // (el siguiente número), para que por ejemplo "6-9X3/4" quede antes
        // que "6-9X1", y "6-18X3/4" no quede después de "6-18X1". Si ambos
        // comparten el mismo prefijo de texto/símbolo seguido de número (ej:
        // #6 y #10, o M6 y M10) los compara por ese número para que #10 no
        // quede antes que #6; y en cualquier otro caso usa el orden
        // alfabético normal en español.
        function compareSubcategory(a, b) {
            const strA = String(a).trim();
            const strB = String(b).trim();
            const tokenA = parseLeadingSubcategoryToken(strA);
            const tokenB = parseLeadingSubcategoryToken(strB);

            if (tokenA && tokenB) {
                if (tokenA.value !== tokenB.value) return tokenA.value - tokenB.value;

                const restA = strA.slice(tokenA.length).replace(/^[\s\-Xx]+/, '');
                const restB = strB.slice(tokenB.length).replace(/^[\s\-Xx]+/, '');
                if (restA === '' && restB === '') return 0;
                return compareSubcategory(restA, restB);
            }
            if (tokenA && !tokenB) return -1; // los números van antes que el texto
            if (!tokenA && tokenB) return 1;  // el texto va después de los números

            const prefA = parseSubcategoryPrefixedNumber(strA);
            const prefB = parseSubcategoryPrefixedNumber(strB);
            if (prefA && prefB && prefA.prefix.toLowerCase() === prefB.prefix.toLowerCase()) {
                return prefA.num - prefB.num;
            }

            return strA.localeCompare(strB, "es", { sensitivity: "base" });
        }

        // Poblar filtros con todos los productos
        function populateFilters() {
            populateFiltersFromProducts(productList);
        }

        // Poblar filtros desde una lista de productos específica
        // includeFeaturedOption: si es false, la opción "Destacados" no se agrega
        // al filtro de categorías (se usa al buscar desde la barra de búsqueda).
        function populateFiltersFromProducts(products, includeFeaturedOption = true) {
            // Categorías
            const categories = [...new Set(products.map(p => p.Category))].sort((a, b) => 
                a.localeCompare(b, "es", { sensitivity: "base" })
            );
            const categorySelect = document.getElementById("category-filter");
            const currentCategory = categorySelect.value;
            categorySelect.innerHTML = '<option value="">Todas las categorías</option>';

            // "Destacados" es una categoría especial basada en FEATURED_CODES.
            // No se muestra en la barra de filtro cuando se llega aquí desde una
            // búsqueda (includeFeaturedOption = false).
            if (includeFeaturedOption && productList.some(isFeaturedProduct)) {
                const featuredOption = document.createElement("option");
                featuredOption.value = DESTACADOS_VALUE;
                featuredOption.textContent = "DESTACADOS";
                // La primera vez que se cargan productos (todavía no se eligió
                // ninguna categoría), "Destacados" queda seleccionado por
                // defecto para que sea lo primero que se muestra en pantalla.
                if (currentCategory === DESTACADOS_VALUE ||
                    (!currentCategory && !defaultCategoryApplied)) {
                    featuredOption.selected = true;
                }
                defaultCategoryApplied = true;
                categorySelect.appendChild(featuredOption);
            }

            categories.forEach(cat => {
                const option = document.createElement("option");
                option.value = cat;
                option.textContent = cat;
                if (cat === currentCategory) option.selected = true;
                categorySelect.appendChild(option);
            });

            // Subcategorías (basadas en la categoría seleccionada o todas)
            const subcategorySelect = document.getElementById("subcategory-filter");
            const currentSubcategory = subcategorySelect.value;
            const categoryFilter = categorySelect.value;
            
            let subcategories;
            if (categoryFilter === DESTACADOS_VALUE) {
                subcategories = [...new Set(
                    products
                        .filter(isFeaturedProduct)
                        .map(p => p.Subcategory)
                )].sort(compareSubcategory);
                subcategorySelect.disabled = false;
            } else if (categoryFilter) {
                subcategories = [...new Set(
                    products
                        .filter(p => p.Category === categoryFilter)
                        .map(p => p.Subcategory)
                )].sort(compareSubcategory);
                subcategorySelect.disabled = false;
            } else {
                subcategories = [...new Set(products.map(p => p.Subcategory))].sort(compareSubcategory);
                subcategorySelect.disabled = true;
            }
            
            subcategorySelect.innerHTML = '<option value="">Todas las subcategorías</option>';
            subcategories.forEach(sub => {
                const option = document.createElement("option");
                option.value = sub;
                option.textContent = sub.toUpperCase();
                if (sub === currentSubcategory) option.selected = true;
                subcategorySelect.appendChild(option);
            });

            // Marcas
            const brands = [...new Set(products.map(p => getProductBrand(p)))]
                .filter(brand => brand && brand !== "Sin Marca")
                .sort((a, b) => a.localeCompare(b, "es", { sensitivity: "base" }));
            const brandSelect = document.getElementById("brand-filter");
            const currentBrand = brandSelect.value;
            brandSelect.innerHTML = '<option value="">Todas las marcas</option>';
            brands.forEach(brand => {
                const option = document.createElement("option");
                option.value = brand;
                option.textContent = brand;
                if (brand === currentBrand) option.selected = true;
                brandSelect.appendChild(option);
            });

            // Actualizar estadísticas
            document.getElementById("total-products").textContent = productList.length;
            document.getElementById("total-categories").textContent = [...new Set(productList.map(p => p.Category))].length;
        }

        // Manejar entrada de búsqueda - actualiza filtros dinámicamente
        function handleSearchInput() {
            // Si el usuario escribe algo distinto en la barra de búsqueda,
            // se quita cualquier filtro de calibre activo de la regleta
            // (igual que al tocar el ícono de la regleta para ocultarla),
            // para que no queden productos ocultos por un filtro de un
            // tornillo distinto al que ahora se busca.
            clearGaugeFilterAndReset();

            const searchTerm = document.getElementById("search-input").value.toLowerCase().trim();
            
            if (searchTerm) {
                // Filtrar productos por término de búsqueda primero
                const matchingProducts = productList.filter(product => {
                    const productBrand = getProductBrand(product);
                    return (product.Description && product.Description.toLowerCase().includes(searchTerm)) ||
                           (product.Code && product.Code.toString().toLowerCase().includes(searchTerm)) ||
                           (product.Reference && product.Reference.toString().toLowerCase().includes(searchTerm)) ||
                           (productBrand && productBrand.toLowerCase().includes(searchTerm)) ||
                           (product.Category && product.Category.toLowerCase().includes(searchTerm));
                });
                
                // Actualizar los filtros con solo las opciones disponibles en los resultados
                // (sin la opción "Destacados": no debe aparecer al buscar desde la barra de búsqueda)
                populateFiltersFromProducts(matchingProducts, false);
            } else {
                // Si no hay búsqueda, volver al estado inicial: mostrar todos
                // los filtros y volver a seleccionar "Destacados" (no "Todas
                // las categorías"), igual que al entrar a la página.
                defaultCategoryApplied = false;
                populateFilters();
                handleCategoryChange();
                return;
            }
            
            filterProducts();
        }

        // Manejar cambio de categoría
        function handleCategoryChange() {
            const categoryFilter = document.getElementById("category-filter").value;
            const subcategorySelect = document.getElementById("subcategory-filter");
            const brandSelect = document.getElementById("brand-filter");
            const searchTerm = document.getElementById("search-input").value.toLowerCase().trim();
            
            // Obtener productos base (filtrados por búsqueda si hay)
            let baseProducts = productList;
            if (searchTerm) {
                baseProducts = productList.filter(product => {
                    const productBrand = getProductBrand(product);
                    return (product.Description && product.Description.toLowerCase().includes(searchTerm)) ||
                           (product.Code && product.Code.toString().toLowerCase().includes(searchTerm)) ||
                           (product.Reference && product.Reference.toString().toLowerCase().includes(searchTerm)) ||
                           (productBrand && productBrand.toLowerCase().includes(searchTerm)) ||
                           (product.Category && product.Category.toLowerCase().includes(searchTerm));
                });
            }
            
            // Actualizar subcategorías
            subcategorySelect.innerHTML = '<option value="">Todas las subcategorías</option>';
            
            // Actualizar marcas
            brandSelect.innerHTML = '<option value="">Todas las marcas</option>';
            
            if (!categoryFilter) {
                subcategorySelect.disabled = true;
                
                // Mostrar todas las marcas cuando no hay categoría seleccionada
                const allBrands = [...new Set(baseProducts.map(p => getProductBrand(p)))]
                    .filter(brand => brand && brand !== "Sin Marca")
                    .sort((a, b) => a.localeCompare(b, "es", { sensitivity: "base" }));
                
                allBrands.forEach(brand => {
                    const option = document.createElement("option");
                    option.value = brand;
                    option.textContent = brand;
                    brandSelect.appendChild(option);
                });
            } else {
                subcategorySelect.disabled = false;
                
                // Filtrar productos por la categoría seleccionada
                // ("Destacados" es una categoría especial basada en FEATURED_CODES)
                const categoryProducts = categoryFilter === DESTACADOS_VALUE
                    ? baseProducts.filter(isFeaturedProduct)
                    : baseProducts.filter(p => p.Category === categoryFilter);
                
                // Obtener subcategorías de la categoría seleccionada
                const subcategories = [...new Set(
                    categoryProducts.map(p => p.Subcategory)
                )].sort(compareSubcategory);
                
                subcategories.forEach(sub => {
                    const option = document.createElement("option");
                    option.value = sub;
                    option.textContent = sub.toUpperCase();
                    subcategorySelect.appendChild(option);
                });
                
                // Obtener marcas disponibles en la categoría seleccionada
                const categoryBrands = [...new Set(
                    categoryProducts.map(p => getProductBrand(p))
                )]
                    .filter(brand => brand && brand !== "Sin Marca")
                    .sort((a, b) => a.localeCompare(b, "es", { sensitivity: "base" }));
                
                categoryBrands.forEach(brand => {
                    const option = document.createElement("option");
                    option.value = brand;
                    option.textContent = brand;
                    brandSelect.appendChild(option);
                });
            }
            
            filterProducts();
        }

        // Manejar cambio de subcategoría
        function handleSubcategoryChange() {
            const categoryFilter = document.getElementById("category-filter").value;
            const subcategoryFilter = document.getElementById("subcategory-filter").value;
            const brandSelect = document.getElementById("brand-filter");
            const searchTerm = document.getElementById("search-input").value.toLowerCase().trim();
            
            // Obtener productos base (filtrados por búsqueda si hay)
            let baseProducts = productList;
            if (searchTerm) {
                baseProducts = productList.filter(product => {
                    const productBrand = getProductBrand(product);
                    return (product.Description && product.Description.toLowerCase().includes(searchTerm)) ||
                           (product.Code && product.Code.toString().toLowerCase().includes(searchTerm)) ||
                           (product.Reference && product.Reference.toString().toLowerCase().includes(searchTerm)) ||
                           (productBrand && productBrand.toLowerCase().includes(searchTerm)) ||
                           (product.Category && product.Category.toLowerCase().includes(searchTerm));
                });
            }
            
            // Filtrar por categoría si hay una seleccionada
            // ("Destacados" es una categoría especial basada en FEATURED_CODES)
            if (categoryFilter === DESTACADOS_VALUE) {
                baseProducts = baseProducts.filter(isFeaturedProduct);
            } else if (categoryFilter) {
                baseProducts = baseProducts.filter(p => p.Category === categoryFilter);
            }
            
            // Filtrar por subcategoría si hay una seleccionada
            if (subcategoryFilter) {
                baseProducts = baseProducts.filter(p => p.Subcategory === subcategoryFilter);
            }
            
            // Actualizar marcas disponibles
            brandSelect.innerHTML = '<option value="">Todas las marcas</option>';
            
            const availableBrands = [...new Set(baseProducts.map(p => getProductBrand(p)))]
                .filter(brand => brand && brand !== "Sin Marca")
                .sort((a, b) => a.localeCompare(b, "es", { sensitivity: "base" }));
            
            availableBrands.forEach(brand => {
                const option = document.createElement("option");
                option.value = brand;
                option.textContent = brand;
                brandSelect.appendChild(option);
            });
            
            filterProducts();
        }

        // Renderiza la sección "Destacados" (antes de todos los productos),
        // agrupando por categoría y subcategoría con sus etiquetas, tal como
        // se hace en el resto del catálogo. Solo incluye los productos cuyo
        // código de barra está en FEATURED_CODES.
        function renderFeaturedProducts() {
            const featuredSection = document.getElementById("featured-section");
            const featuredContent = document.getElementById("featured-content");
            if (!featuredSection || !featuredContent) return;

            featuredContent.innerHTML = "";

            if (!FEATURED_CODES || FEATURED_CODES.length === 0) {
                featuredSection.style.display = "none";
                return;
            }

            const featuredCodesSet = new Set(FEATURED_CODES.map(c => String(c).trim()));
            const featured = productList.filter(p =>
                p.Code !== undefined && p.Code !== null && featuredCodesSet.has(String(p.Code).trim())
            );

            if (featured.length === 0) {
                featuredSection.style.display = "none";
                return;
            }

            featuredSection.style.display = "block";

            // Mismo orden que el resto del catálogo: categoría, subcategoría y precio
            featured.sort((a, b) => {
                const catCompare = a.Category.localeCompare(b.Category, "es", { sensitivity: "base" });
                if (catCompare !== 0) return catCompare;
                const subCompare = compareSubcategory(a.Subcategory, b.Subcategory);
                if (subCompare !== 0) return subCompare;
                const priceCompare = (a.Price || 0) - (b.Price || 0);
                if (priceCompare !== 0) return priceCompare;
                if (String(a.Category).trim().toUpperCase() === "TORNILLOS Y FIJACIONES") {
                    const tagA = getLastWordTag(a.Description, a.Category);
                    const tagB = getLastWordTag(b.Description, b.Category);
                    return compareTagsForSort(tagA, tagB);
                }
                return 0;
            });

            let currentCategory = null;
            let currentSubcategory = null;
            let currentGrid = null;

            featured.forEach(product => {
                const category = product.Category;
                const subcategory = product.Subcategory;
                const groupKey = `featured|||${category}|||${subcategory}`;

                if (category !== currentCategory) {
                    if (currentGrid) featuredContent.appendChild(currentGrid);
                    const categoryHeader = document.createElement('div');
                    categoryHeader.className = 'category-header';
                    categoryHeader.textContent = category;
                    featuredContent.appendChild(categoryHeader);
                    if (String(category).trim().toUpperCase() === 'TORNILLOS Y FIJACIONES') {
                        featuredContent.appendChild(createBoltGaugeElement());
                    }
                    currentCategory = category;
                    currentSubcategory = null;
                    currentGrid = null;
                }

                if (subcategory !== currentSubcategory) {
                    if (currentGrid) featuredContent.appendChild(currentGrid);

                    const subcategoryHeader = document.createElement('div');
                    subcategoryHeader.className = 'subcategory-header';
                    subcategoryHeader.setAttribute('data-group', groupKey);
                    const subIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M9.828 3h3.982a2 2 0 0 1 1.992 2.181l-.637 7A2 2 0 0 1 13.174 14H2.826a2 2 0 0 1-1.991-1.819l-.637-7a2 2 0 0 1 .342-1.31L.5 3a2 2 0 0 1 2-2h3.672a2 2 0 0 1 1.414.586l.828.828A2 2 0 0 0 9.828 3zm-8.322.12q.322-.119.687-.12h8.66l-.31-.31L8.373 1.5H2.5a1 1 0 0 0-1 .981z"/></svg>';
                    const subLabel = document.createElement('span');
                    subLabel.textContent = subcategory.toUpperCase();
                    subcategoryHeader.innerHTML = subIcon;
                    subcategoryHeader.appendChild(subLabel);

                    // Etiquetas con la última palabra de cada producto de esta subcategoría
                    const groupProducts = featured.filter(p =>
                        p.Category === category && p.Subcategory === subcategory);
                    const uniqueTags = [...new Set(
                        groupProducts.map(p => getLastWordTag(p.Description, p.Category)).filter(Boolean)
                    )].sort(compareSubcategory);

                    if (uniqueTags.length > 0) {
                        const tagsContainer = document.createElement('span');
                        tagsContainer.className = 'subcat-tags';
                        uniqueTags.forEach(tag => {
                            const tagEl = document.createElement('span');
                            tagEl.className = 'subcat-tag';
                            tagEl.textContent = tag;
                            tagEl.setAttribute('data-tag', tag);
                            tagEl.addEventListener('click', (e) => {
                                e.stopPropagation();
                                filterProductsByTag(groupKey, tag, tagEl);
                            });
                            tagsContainer.appendChild(tagEl);
                        });
                        subcategoryHeader.appendChild(tagsContainer);
                    }

                    featuredContent.appendChild(subcategoryHeader);

                    currentGrid = document.createElement('div');
                    currentGrid.className = 'products-grid';
                    currentGrid.setAttribute('data-group', groupKey);
                    currentSubcategory = subcategory;
                }

                const productHTML = createProductCard(product);
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = productHTML;
                currentGrid.appendChild(tempDiv.firstElementChild);
            });

            if (currentGrid) featuredContent.appendChild(currentGrid);
        }

        // Filtrar productos
        function filterProducts() {
            const categoryFilter = document.getElementById("category-filter").value;
            const subcategoryFilter = document.getElementById("subcategory-filter").value;
            const brandFilter = document.getElementById("brand-filter").value;
            const searchTerm = document.getElementById("search-input").value.toLowerCase().trim();

            filteredProducts = productList.filter(product => {
                // "Destacados" es una categoría especial basada en FEATURED_CODES,
                // no en el campo Category del producto.
                const matchesCategory = !categoryFilter ||
                    (categoryFilter === DESTACADOS_VALUE ? isFeaturedProduct(product) : product.Category === categoryFilter);
                const matchesSubcategory = !subcategoryFilter || product.Subcategory === subcategoryFilter;
                
                // Obtener marca del producto (del campo Brand o extraída del nombre)
                const productBrand = getProductBrand(product);
                const matchesBrand = !brandFilter || productBrand === brandFilter;
                
                const matchesSearch = !searchTerm || 
                    (product.Description && product.Description.toLowerCase().includes(searchTerm)) ||
                    (product.Code && product.Code.toString().toLowerCase().includes(searchTerm)) ||
                    (product.Reference && product.Reference.toString().toLowerCase().includes(searchTerm)) ||
                    (productBrand && productBrand.toLowerCase().includes(searchTerm)) ||
                    (product.Category && product.Category.toLowerCase().includes(searchTerm));

                return matchesCategory && matchesSubcategory && matchesBrand && matchesSearch;
            });

            // No hace falta reordenar aquí: productList ya está ordenado por
            // categoría, subcategoría y precio (ver sortProductList), y
            // Array.filter conserva el orden relativo de los elementos.

            displayedCount = 0;
            renderedGroups = {};
            const catalogContentEl = document.getElementById("catalog-content");
            catalogContentEl.innerHTML = "";
            // Marca el contenedor cuando se está mostrando "Destacados" para
            // que, solo en pantallas grandes, las tarjetas se agrupen una
            // tras otra en fila (ver CSS de .showing-destacados).
            catalogContentEl.classList.toggle("showing-destacados", categoryFilter === DESTACADOS_VALUE);
            // Render inmediato (sin retraso) para evitar el parpadeo al filtrar
            loadMoreProducts(true);

            // Si había un filtro de calibre activo (círculo de la regleta),
            // se vuelve a aplicar sobre las tarjetas recién renderizadas.
            if (activeGaugeFilter) {
                applyGaugeFilter();
            }
        }

        // Cargar más productos (scroll infinito)
        // immediate = true renderiza de forma síncrona, evitando el destello
        // en blanco que ocurría al cambiar un filtro.
        function loadMoreProducts(immediate = false) {
            if (isLoading || displayedCount >= filteredProducts.length) return;
            
            isLoading = true;
            const loadingIndicator = document.getElementById("loading-more");
            const catalogContent = document.getElementById("catalog-content");
            
            if (displayedCount > 0) {
                loadingIndicator.style.display = "block";
            }

            const renderBatch = () => {
                // Estado vacío
                if (filteredProducts.length === 0 && displayedCount === 0) {
                    catalogContent.innerHTML = `
                        <div class="empty-state">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                            <h3>No se encontraron productos</h3>
                            <p>Intenta ajustar los filtros o términos de búsqueda</p>
                        </div>
                    `;
                    loadingIndicator.style.display = "none";
                    isLoading = false;
                    return;
                }

                // Calcular el rango de productos a mostrar
                const startIndex = displayedCount;
                const endIndex = Math.min(displayedCount + PRODUCTS_PER_LOAD, filteredProducts.length);
                const productsToShow = filteredProducts.slice(startIndex, endIndex);
                
                // Agrupar solo los productos del lote actual
                let currentCategory = null;
                let currentSubcategory = null;
                let currentGrid = null;
                
                for (let i = 0; i < productsToShow.length; i++) {
                    const product = productsToShow[i];
                    const category = product.Category;
                    const subcategory = product.Subcategory;
                    const groupKey = `${category}|||${subcategory}`;
                    
                    // Si cambia la categoría, agregar header de categoría
                    if (category !== currentCategory) {
                        // Cerrar grid anterior si existe
                        if (currentGrid) {
                            catalogContent.appendChild(currentGrid);
                            currentGrid = null;
                        }
                        
                        // Solo agregar header si no existe ya
                        if (!renderedGroups[`cat_${category}`]) {
                            const categoryHeader = document.createElement('div');
                            categoryHeader.className = 'category-header';
                            categoryHeader.textContent = category;
                            catalogContent.appendChild(categoryHeader);
                            if (String(category).trim().toUpperCase() === 'TORNILLOS Y FIJACIONES') {
                                catalogContent.appendChild(createBoltGaugeElement());
                            }
                            renderedGroups[`cat_${category}`] = true;
                        }
                        currentCategory = category;
                        currentSubcategory = null; // Reset subcategoría
                    }
                    
                    // Si cambia la subcategoría, agregar header de subcategoría
                    if (subcategory !== currentSubcategory) {
                        // Cerrar grid anterior si existe
                        if (currentGrid) {
                            catalogContent.appendChild(currentGrid);
                        }
                        
                        // Solo agregar header si no existe ya
                        if (!renderedGroups[groupKey]) {
                            const subcategoryHeader = document.createElement('div');
                            subcategoryHeader.className = 'subcategory-header';
                            subcategoryHeader.setAttribute('data-group', groupKey);
                            const subIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M9.828 3h3.982a2 2 0 0 1 1.992 2.181l-.637 7A2 2 0 0 1 13.174 14H2.826a2 2 0 0 1-1.991-1.819l-.637-7a2 2 0 0 1 .342-1.31L.5 3a2 2 0 0 1 2-2h3.672a2 2 0 0 1 1.414.586l.828.828A2 2 0 0 0 9.828 3zm-8.322.12q.322-.119.687-.12h8.66l-.31-.31L8.373 1.5H2.5a1 1 0 0 0-1 .981z"/></svg>';
                            const subLabel = document.createElement('span');
                            subLabel.textContent = subcategory.toUpperCase();
                            subcategoryHeader.innerHTML = subIcon;
                            subcategoryHeader.appendChild(subLabel);

                            // Etiquetas con la última palabra de cada producto de esta subcategoría
                            const groupProducts = filteredProducts.filter(p =>
                                p.Category === category && p.Subcategory === subcategory);
                            const uniqueTags = [...new Set(
                                groupProducts.map(p => getLastWordTag(p.Description, p.Category)).filter(Boolean)
                            )].sort(compareSubcategory);

                            if (uniqueTags.length > 0) {
                                const tagsContainer = document.createElement('span');
                                tagsContainer.className = 'subcat-tags';
                                uniqueTags.forEach(tag => {
                                    const tagEl = document.createElement('span');
                                    tagEl.className = 'subcat-tag';
                                    tagEl.textContent = tag;
                                    tagEl.setAttribute('data-tag', tag);
                                    tagEl.addEventListener('click', (e) => {
                                        e.stopPropagation();
                                        filterProductsByTag(groupKey, tag, tagEl);
                                    });
                                    tagsContainer.appendChild(tagEl);
                                });
                                subcategoryHeader.appendChild(tagsContainer);
                            }

                            catalogContent.appendChild(subcategoryHeader);
                            renderedGroups[groupKey] = true;
                        }
                        
                        // Crear nuevo grid o buscar el existente
                        const existingGrid = document.querySelector(`.products-grid[data-group="${CSS.escape(groupKey)}"]`);
                        if (existingGrid) {
                            currentGrid = existingGrid;
                        } else {
                            currentGrid = document.createElement('div');
                            currentGrid.className = 'products-grid';
                            currentGrid.setAttribute('data-group', groupKey);
                        }
                        currentSubcategory = subcategory;
                    }
                    
                    // Agregar producto al grid actual
                    const productHTML = createProductCard(product);
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = productHTML;
                    const productElement = tempDiv.firstElementChild;
                    
                    // Si el grid ya está en el DOM, agregar directamente
                    if (currentGrid.parentNode) {
                        currentGrid.appendChild(productElement);
                    } else {
                        currentGrid.appendChild(productElement);
                    }
                }
                
                // Agregar el último grid si existe y no está en el DOM
                if (currentGrid && !currentGrid.parentNode) {
                    catalogContent.appendChild(currentGrid);
                }
                
                displayedCount = endIndex;
                loadingIndicator.style.display = "none";
                isLoading = false;
                
                // Actualizar contador de productos mostrados
                document.getElementById("showing-products").textContent = `${displayedCount} de ${filteredProducts.length}`;
            };

            // Si es inmediato (cambio de filtro), renderizar en el acto para
            // que no haya parpadeo. En el scroll infinito se mantiene el
            // pequeño retraso para mostrar el indicador de carga.
            if (immediate) {
                renderBatch();
            } else {
                setTimeout(renderBatch, 100);
            }
        }

        // Escapar para atributos HTML (maneja comillas dobles y simples)
        function escapeForAttribute(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // Al hacer clic en una etiqueta de subcategoría, mostrar únicamente
        // el o los productos cuya última palabra coincide con esa etiqueta.
        // Si se vuelve a hacer clic en la misma etiqueta activa, se restauran
        // todos los productos de la subcategoría.
        function filterProductsByTag(groupKey, tagValue, tagElement) {
            // Antes se quitaba aquí cualquier filtro de calibre (círculo de
            // la regleta) que estuviera activo. Eso hacía que, después de
            // buscar un tamaño en la regleta y dar clic en una etiqueta para
            // ver el producto puntual, se volvieran a mostrar TODOS los
            // demás tornillos (de otros tamaños/subcategorías) que no tenían
            // nada que ver con la búsqueda. Ahora el filtro de calibre se
            // deja activo: la etiqueta solo acota dentro de lo que ya
            // coincidía con el tamaño elegido, sin volver a mostrar el
            // resto.

            // Antes de filtrar por etiqueta, cargar TODOS los productos que
            // falten (sin esperar a que el usuario desplace hacia abajo), para
            // que la etiqueta muestre absolutamente todos los productos que le
            // pertenecen y no solo los que ya se habían cargado hasta ese punto.
            while (displayedCount < filteredProducts.length) {
                loadMoreProducts(true);
            }

            const grid = document.querySelector(`.products-grid[data-group="${CSS.escape(groupKey)}"]`);
            if (!grid) return;

            const wasActive = tagElement.classList.contains('active');

            // Quitar el estado activo de las demás etiquetas de esta misma subcategoría
            const header = tagElement.closest('.subcategory-header');
            if (header) {
                header.querySelectorAll('.subcat-tag').forEach(t => t.classList.remove('active'));
            }

            const cards = grid.querySelectorAll('.product-card');

            if (wasActive) {
                cards.forEach(card => card.classList.remove('hidden-by-tag'));
                return;
            }

            tagElement.classList.add('active');

            cards.forEach(card => {
                const description = card.getAttribute('data-description') || '';
                const cardCategory = card.getAttribute('data-category') || '';
                const cardTag = getLastWordTag(description, cardCategory);
                card.classList.toggle('hidden-by-tag', cardTag !== tagValue);
            });
        }

        // Manejar click en producto
        function handleProductClick(element) {
            const code = element.getAttribute('data-code');
            const description = element.getAttribute('data-description');
            const price = parseFloat(element.getAttribute('data-price'));
            const cost = parseFloat(element.getAttribute('data-cost'));
            const exempt = element.getAttribute('data-exempt') === 'true';
            addProductToInvoice(code, description, price, cost, exempt);
        }

        // Crear tarjeta de producto
        function createProductCard(product) {
            const price = product.Price || 0;
            const cost = product.Cost || 0;
            const refCode = (product.Code !== undefined && product.Code !== null)
                ? product.Code.toString().trim()
                : '';
            const isExempt = isProductExempt(product);
            // Si el producto está exento del 7% de ITBMS, se cobra su
            // precio normal tal cual (sin sumarle el impuesto).
            const priceWithTax = isExempt ? price : price * 1.07;
            const profit = cost > 0 ? price - cost : 0;
            const margin = cost > 0 ? ((profit / cost) * 100) : 0;
            const productBrand = getProductBrand(product);

            // Usar data attributes para evitar problemas con comillas
            const safeCode = escapeForAttribute(product.Code);
            const safeDescription = escapeForAttribute(product.Description);

            // Imagen de fondo según el código de referencia.
            // Si el producto no tiene código, no se intenta mostrar imagen.
            // Si la imagen no existe en la carpeta "imagenes", se oculta automáticamente (onerror).
            const imageTag = refCode
                ? `<img class="product-bg-image" src="imagenes/${encodeURIComponent(refCode)}.jpg" alt="" data-ref="${escapeForAttribute(refCode)}" onload="handleImageLoad(this)" onerror="handleImageError(this)">`
                : '';

            // Miniatura en la esquina inferior derecha (solo si hay imagen),
            // tal como estaba siempre. Si ninguna extensión existe, se
            // oculta automáticamente (onerror).
            const thumbTag = refCode
                ? `<img class="product-thumb" src="imagenes/${encodeURIComponent(refCode)}.jpg" alt="" data-ref="${escapeForAttribute(refCode)}" onerror="handleThumbError(this)">`
                : '';

            return `
                <div class="product-card" data-code="${safeCode}" data-description="${safeDescription}" data-category="${escapeForAttribute(product.Category)}" data-subcategory="${escapeForAttribute(product.Subcategory)}" data-price="${price}" data-cost="${cost}" data-exempt="${isExempt}">
                    ${imageTag}
                    ${thumbTag}
                    <div class="badges-container">
                        <div>
                            ${cost > 0 ? `<span class="badge badge-cost">Costo: $${cost.toFixed(2)}</span>` : ''}
                        </div>
                        <div>
                            ${cost > 0 ? `<span class="badge badge-margin">${margin.toFixed(0)}%</span>` : ''}
                            ${cost > 0 ? `<span class="badge badge-profit">+$${profit.toFixed(2)}</span>` : ''}
                        </div>
                    </div>

                    <div class="quote-row">
                        <button type="button" class="quote-tab" data-code="${safeCode}" data-description="${safeDescription}" data-price="${price}" data-cost="${cost}" data-exempt="${isExempt}" onclick="handleProductClick(this)">
                            <span>COTIZAR</span>
                        </button>
                    </div>
                    
                    <div class="product-category">${escapeHtml(product.Category)}</div>
                    
                    <div class="product-brand">${escapeHtml(productBrand)}</div>
                    <div class="product-name">${escapeHtml(product.Description)}</div>
                    ${product.Reference ? `<div class="product-code" style="margin-bottom:0;">${escapeHtml(product.Reference)}</div>` : ''}
                    <div class="product-code">Código: ${escapeHtml(product.Code)}</div>
                    
                    <div class="price-section">
                        <div class="price-main"><span>$${priceWithTax.toFixed(2)}</span></div>
                        <div class="price-tax">${isExempt ? 'Exento de ITBMS (7%)' : `$${price.toFixed(2)} Sin ITBMS (7%)`}</div>
                    </div>
                </div>
            `;
        } // <div class="product-subcategory">${escapeHtml(product.Subcategory)}</div>/ linea 1146

        // Probar varias extensiones de imagen para el código de referencia.
        // Si ninguna existe en la carpeta "imagenes", se elimina la imagen (no se muestra nada).
        function handleImageError(img) {
            const ref = img.getAttribute('data-ref');
            const extensions = ['jpg', 'jpeg', 'png', 'webp'];
            let index = parseInt(img.dataset.extIndex || '0', 10);
            index++;
            if (index >= extensions.length) {
                const card = img.closest('.product-card');
                if (card) card.classList.remove('has-image');
                img.remove();
                return;
            }
            img.dataset.extIndex = index;
            img.src = 'imagenes/' + encodeURIComponent(ref) + '.' + extensions[index];
        }

        // Cuando la imagen carga correctamente, marcar la tarjeta para ocultar la info en hover.
        function handleImageLoad(img) {
            const card = img.closest('.product-card');
            if (card) card.classList.add('has-image');
        }

        // Probar varias extensiones para la miniatura de la esquina.
        // Si ninguna existe, se elimina la miniatura (no se muestra nada en la esquina).
        function handleThumbError(img) {
            const ref = img.getAttribute('data-ref');
            const extensions = ['jpg', 'jpeg', 'png', 'webp'];
            let index = parseInt(img.dataset.extIndex || '0', 10);
            index++;
            if (index >= extensions.length) {
                img.remove();
                return;
            }
            img.dataset.extIndex = index;
            img.src = 'imagenes/' + encodeURIComponent(ref) + '.' + extensions[index];
        }

        // Escapar HTML
        function escapeHtml(text) {            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Manejar scroll
        function handleScroll() {
            const scrollPosition = window.innerHeight + window.scrollY;
            const documentHeight = document.documentElement.scrollHeight;
            
            if (scrollPosition >= documentHeight - 500) {
                loadMoreProducts();
            }
        }

        // Toggle botón scroll top
        function toggleScrollTopButton() {
            const scrollBtn = document.getElementById("scroll-top");
            if (window.scrollY > 300) {
                scrollBtn.classList.add("visible");
            } else {
                scrollBtn.classList.remove("visible");
            }
        }

        // Scroll to top
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        // Agregar producto a la factura
        function addProductToInvoice(code, description, price, cost, exempt = false) {
            cost = cost || 0;
            
            let quantity = prompt(`Ingrese la cantidad para "${description}":`, "1");

            if (quantity === null) {
                return;
            }

            quantity = Number.parseInt(quantity);
            if (isNaN(quantity) || quantity <= 0) {
                alert("Por favor ingrese una cantidad válida mayor que cero.");
                return;
            }

            let margin = 0;
            if (cost > 0) {
                margin = ((price - cost) / cost) * 100;
            }

            const selectedProduct = {
                code: code,
                description: description,
                price: price,
                quantity: quantity,
                cost: cost,
                margin: margin,
                exempt: exempt
            };

            let selectedProducts = [];
            try {
                const existingProducts = localStorage.getItem("selectedProducts");
                if (existingProducts) {
                    selectedProducts = JSON.parse(existingProducts);
                }
            } catch (e) {
                console.error("Error al analizar productos existentes:", e);
            }

            selectedProducts.push(selectedProduct);

            localStorage.setItem("selectedProducts", JSON.stringify(selectedProducts));

            showNotification(`Producto "${description}" (${quantity} unidades) agregado a la factura`);
        }

        // Mostrar notificación
        function showNotification(message, isError = false) {
            const notification = document.getElementById("notification");
            notification.textContent = message;
            notification.style.background = isError 
                ? "#e53935" 
                : "var(--primary-color)";
            notification.classList.add("show");
            
            setTimeout(() => {
                notification.classList.remove("show");
            }, 3000);
        }

        function printCatalog() {

        }

        // Alternar entre vista de tarjetas (cuadrícula) y vista de lista.
        // El modo tarjeta es el predeterminado (no se agrega ninguna clase).
        function toggleViewMode() {
            const isListView = document.body.classList.toggle('list-view');
            updateViewToggleIcon(isListView);
            try {
                localStorage.setItem('catalogViewMode', isListView ? 'list' : 'grid');
            } catch (e) {
                console.error('No se pudo guardar la preferencia de vista:', e);
            }
        }

        // Muestra el ojo abierto en modo tarjeta y el ojo cerrado en modo lista
        function updateViewToggleIcon(isListView) {
            const openEye = document.getElementById('icon-eye-open');
            const closedEye = document.getElementById('icon-eye-closed');

        // Al cargar la página, restaurar la preferencia de vista guardada
        // (si no hay ninguna guardada, se queda en modo tarjeta por defecto)
        (function initViewMode() {

            try {
                savedMode = localStorage.getItem('catalogViewMode');
            } catch (e) {
                savedMode = null;

            if (savedMode === 'list') {

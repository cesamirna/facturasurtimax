        // ==========================================================
        // Regleta calibradora de tornillos (mm / pulgadas)
        // Solo aparece justo después del título de la categoría
        // "TORNILLOS Y FIJACIONES", y solo cuando el botón de la regla
        // (junto al botón de vista) está activado.
        // ==========================================================

        function fractionToDecimal(frac) {
            const parts = String(frac).split('/');
            if (parts.length === 2) {
                return parseFloat(parts[0]) / parseFloat(parts[1]);
            }
            return parseFloat(frac);
        }

        function gcdNum(a, b) {
            return b === 0 ? a : gcdNum(b, a % b);
        }

        function simplifyFraction(num, den) {
            if (num === 0) return '0';
            if (num === den) return '1"';
            const g = gcdNum(num, den);
            return `${num / g}/${den / g}"`;
        }

        // Escapa comillas dobles para poder usarlas dentro de atributos
        // HTML delimitados también por comillas dobles (ej. 0.118" o 5/16").
        function escapeAttr(str) {
            return String(str).replace(/"/g, '&quot;');
        }

        // Construye el SVG de la regleta calibradora con dos filas de
        // agujeros (milímetros y pulgadas) y reglas graduadas arriba y abajo.
        function buildBoltGaugeSVG() {
            const mmSizes = [22, 20, 18, 16, 14, 12, 10, 8, 7, 6, 5, 4, 3];
            // Tornillos pequeños identificados por número de calibre (con su
            // diámetro real en pulgadas) seguidos de los tamaños en fracción
            // de pulgada, tal como se solicitó.
            // "fraction" es la fracción de pulgada equivalente a cada calibre
            // numérico, tal como la especificó Cesar. Solo se usa en el
            // tooltip (al pasar el mouse); la etiqueta visible de la regleta
            // sigue mostrando "#4", "#5", etc.
            const inchGaugeSizes = [
                { label: '4', decimal: 0.112, fraction: '7/64' },
                { label: '5', decimal: 0.125, fraction: '1/8' },
                { label: '6', decimal: 0.138, fraction: '9/64' },
                { label: '8', decimal: 0.15625, fraction: '5/32' },
                { label: '10', decimal: 0.1875, fraction: '3/16' },
                { label: '12', decimal: 0.21875, fraction: '7/32' }
            ];
            const inchFractionSizes = ['1/4', '5/16', '3/8', '7/16', '1/2', '9/16', '5/8', '3/4', '1'];
            const inchItems = [
                ...inchGaugeSizes.map(g => ({ label: g.label, decimal: g.decimal, fraction: g.fraction, isFraction: false })),
                ...inchFractionSizes.map(f => ({ label: f, decimal: fractionToDecimal(f), isFraction: true }))
            ].sort((a, b) => a.decimal - b.decimal);

            const rowStartX = 100, rowEndX = 920;
            const rowSpan = rowEndX - rowStartX;

            // Fuente y color iguales a los títulos de categoría/subcategoría
            // del catálogo, para que la regleta combine con el resto del sitio.
            const fontStack = "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            const primaryColor = "#303030";
            const primaryDark = "#3c3c3d";

            // Mide el ancho real de un texto (usando un canvas oculto) para
            // que el fondo redondeado de cada badge se ajuste a su contenido
            // en lugar de usar una estimación fija por cantidad de caracteres.
            function measureTextWidth(text, fontSize, fontWeight = '600') {
                if (!measureTextWidth._ctx) {
                    measureTextWidth._ctx = document.createElement('canvas').getContext('2d');
                }
                measureTextWidth._ctx.font = `${fontWeight} ${fontSize}px ${fontStack}`;
                return measureTextWidth._ctx.measureText(text).width;
            }

            // Regla superior graduada en milímetros (100 a 0 mm), con marcas intermedias.
            // (Se sube 14px respecto al borde del rectángulo para reducir el
            // espacio vacío que quedaba libre ahora que el título está afuera.)
            let topRuler = '';
            for (let mm = 0; mm <= 100; mm += 10) {
                const x = rowStartX + ((100 - mm) / 100) * rowSpan;
                topRuler += `<line x1="${x.toFixed(1)}" y1="28" x2="${x.toFixed(1)}" y2="36" stroke="${primaryColor}" stroke-width="1.5"/>`;
                topRuler += `<text x="${x.toFixed(1)}" y="24" font-size="9" fill="${primaryColor}" text-anchor="middle" font-family="${fontStack}">${mm}</text>`;
                if (mm < 100) {
                    const minorX = rowStartX + ((100 - (mm + 5)) / 100) * rowSpan;
                    topRuler += `<line x1="${minorX.toFixed(1)}" y1="28" x2="${minorX.toFixed(1)}" y2="35" stroke="${primaryColor}" stroke-width="1.5"/>`;
                }
            }
            topRuler += `<line x1="${rowStartX}" y1="36" x2="${rowEndX}" y2="36" stroke="${primaryColor}" stroke-width="1.5"/>`;

            // Fila de agujeros en milímetros: cada círculo queda centrado
            // exactamente debajo de su etiqueta, como en la referencia.
            let mmHoles = '';
            const mmBadgeY = 40;
            const mmCircleTopY = mmBadgeY + 24;
            mmSizes.forEach((size, i) => {
                const x = rowStartX + (i / (mmSizes.length - 1)) * rowSpan;
                const r = Math.min(6 + size * 1.0, 26);
                // El borde superior común evita que los círculos pequeños
                // queden más abajo que sus etiquetas.
                const cy = mmCircleTopY + r;
                const inchEquiv = (size / 25.4).toFixed(3);
                const label = `M${size} - Ø ${size}mm (${inchEquiv}")`;
                const badgeText = String(size);
                const badgeW = Math.max(18, measureTextWidth(badgeText, 9.5) + 13);
                mmHoles += `<circle class="bolt-gauge-hole" data-size-label="${escapeAttr(label)}" data-unit="mm" data-filter-value="${size}" data-display-label="${size} mm" onclick="handleGaugeHoleClick(this)" cx="${x.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="transparent" stroke="${primaryColor}" stroke-width="1.5" pointer-events="all"/>`;
                mmHoles += `<rect x="${(x - badgeW / 2).toFixed(1)}" y="${mmBadgeY.toFixed(1)}" width="${badgeW}" height="16" rx="5" fill="${primaryColor}" pointer-events="none"/>`;
                mmHoles += `<text x="${x.toFixed(1)}" y="${(mmBadgeY + 11.5).toFixed(1)}" font-size="9.5" fill="#ffffff" text-anchor="middle" font-family="${fontStack}" font-weight="600" pointer-events="none">${badgeText}</text>`;
            });

            // Fila de agujeros en pulgadas (calibre numérico + fracciones)
            // Misma lógica: línea base común para los círculos y etiquetas
            // alineadas en una sola fila horizontal.
            let inchHoles = '';
            // La escala de pulgadas se acerca a la fila métrica para
            // aprovechar el espacio vertical, como en la referencia.
            const inchBaselineY = 149;
            const inchBadgeY = inchBaselineY + 7;
            inchItems.forEach((item, i) => {
                const x = rowStartX + (i / (inchItems.length - 1)) * rowSpan;
                const r = Math.min(6 + item.decimal * 26, 28);
                const cy = inchBaselineY - r;
                const mmEquiv = (item.decimal * 25.4).toFixed(2);
                const displayLabel = item.isFraction ? `${item.label}"` : `#${item.label}`;
                const label = item.isFraction
                    ? `${item.label}" - Ø ${mmEquiv}mm`
                    : `${item.label} - Ø ${mmEquiv}mm (${item.fraction}")`;
                const badgeW = Math.max(18, measureTextWidth(displayLabel, 9.5) + 13);
                const filterUnit = item.isFraction ? 'in-fraction' : 'in-gauge';
                inchHoles += `<circle class="bolt-gauge-hole" data-size-label="${escapeAttr(label)}" data-unit="${filterUnit}" data-filter-value="${escapeAttr(item.label)}" data-display-label="${escapeAttr(displayLabel)}" onclick="handleGaugeHoleClick(this)" cx="${x.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="transparent" stroke="${primaryColor}" stroke-width="1.5" pointer-events="all"/>`;
                inchHoles += `<rect x="${(x - badgeW / 2).toFixed(1)}" y="${inchBadgeY.toFixed(1)}" width="${badgeW}" height="16" rx="5" fill="${primaryColor}" pointer-events="none"/>`;
                inchHoles += `<text x="${x.toFixed(1)}" y="${(inchBadgeY + 11.5).toFixed(1)}" font-size="9.5" fill="#ffffff" text-anchor="middle" font-family="${fontStack}" font-weight="600" pointer-events="none">${displayLabel}</text>`;
            });

            // Regla inferior graduada en pulgadas en incrementos de 1/32".
            // Se muestra la fracción en cada segunda línea (1/16", 1/8", etc.).
            let bottomRuler = '';
            for (let s = 0; s <= 32; s++) {
                const x = rowStartX + (s / 32) * rowSpan;
                const showFraction = s % 2 === 0;
                // Fracciones "impares" de 1/16 (1/16, 3/16, 5/16, 7/16, 9/16,
                // 11/16, 13/16, 15/16): en lugar de la línea, el valor sube
                // y ocupa el sitio de esa línea (sin línea ni etiqueta abajo).
                const isHighlighted = s % 4 === 2;
                if (isHighlighted) {
                    // Línea muy corta, apenas para dar un poco de espacio
                    // antes del valor (que queda elevado, cerca de la regla).
                    bottomRuler += `<line x1="${x.toFixed(1)}" y1="176" x2="${x.toFixed(1)}" y2="180" stroke="${primaryColor}" stroke-width="1.5"/>`;
                    bottomRuler += `<text x="${x.toFixed(1)}" y="190" font-size="9" fill="${primaryColor}" text-anchor="middle" font-family="${fontStack}">${simplifyFraction(s, 32)}</text>`;
                    continue;
                }
                const tickLen = showFraction ? 8 : 5;
                bottomRuler += `<line x1="${x.toFixed(1)}" y1="176" x2="${x.toFixed(1)}" y2="${176 + tickLen}" stroke="${primaryColor}" stroke-width="1.5"/>`;
                if (showFraction) {
                    const fractionLabel = simplifyFraction(s, 32);
                    // Los cuartos (1/4", 1/2", 3/4") se destacan con el mismo
                    // fondo redondeado que el resto de las etiquetas (badges).
                    const isQuarterMark = (s % 8 === 0) && s !== 0 && s !== 32;
                    if (isQuarterMark) {
                        const badgeW = Math.max(16, measureTextWidth(fractionLabel, 9) + 11);
                        const badgeY = 186; //Espacio entre fracciones y la linea
                        const badgeH = 13;
                        bottomRuler += `<rect x="${(x - badgeW / 2).toFixed(1)}" y="${badgeY}" width="${badgeW}" height="${badgeH}" rx="4" fill="${primaryColor}"/>`;
                        bottomRuler += `<text x="${x.toFixed(1)}" y="${(badgeY + badgeH / 2 + 3).toFixed(1)}" font-size="9" fill="#ffffff" text-anchor="middle" font-family="${fontStack}" font-weight="600">${fractionLabel}</text>`;
                    } else {
                        bottomRuler += `<text x="${x.toFixed(1)}" y="197" font-size="9" fill="${primaryColor}" text-anchor="middle" font-family="${fontStack}">${fractionLabel}</text>`;
                    }
                }
            }
            bottomRuler += `<line x1="${rowStartX}" y1="176" x2="${rowEndX}" y2="176" stroke="${primaryColor}" stroke-width="1.5"/>`;

            return `
                <svg class="bolt-gauge-plate" viewBox="0 0 1000 213" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="10" width="980" height="193" rx="14" fill="none" stroke="${primaryDark}" stroke-width="1.5"/>
                    <text x="0" y="0" transform="translate(960, 106) rotate(90)" font-size="10" font-weight="600" fill="${primaryColor}" text-anchor="middle" font-family="${fontStack}">REGLETA CALIBRADOR</text>
                    <text x="26" y="49" font-size="10" font-weight="600" fill="${primaryColor}" font-family="${fontStack}">MM</text>
                    <text x="26" y="184" font-size="10" font-weight="600" fill="${primaryColor}" font-family="${fontStack}">IN</text>
                    ${topRuler}
                    ${mmHoles}
                    ${inchHoles}
                    ${bottomRuler}
                </svg>
            `;
        }

        // Crea el contenedor de la regleta calibradora, listo para insertarse
        // justo después del encabezado de categoría "TORNILLOS Y FIJACIONES".
        function createBoltGaugeElement() {
            const wrapper = document.createElement('div');
            wrapper.className = 'bolt-gauge-wrapper';
            wrapper.innerHTML = buildBoltGaugeSVG();
            return wrapper;
        }

        // Tooltip flotante que sigue al mouse mientras se pasa por cada
        // agujero de la regleta, mostrando el tamaño exacto en mm y pulgadas.
        function setupBoltGaugeTooltip() {
            let tooltip = document.getElementById('bolt-gauge-tooltip');
            if (!tooltip) {
                tooltip = document.createElement('div');
                tooltip.id = 'bolt-gauge-tooltip';
                document.body.appendChild(tooltip);
            }
            document.addEventListener('mouseover', (e) => {
                const hole = e.target.closest('.bolt-gauge-hole');
                if (hole) {
                    tooltip.textContent = hole.getAttribute('data-size-label') || '';
                    tooltip.style.display = 'block';
                }
            });
            document.addEventListener('mousemove', (e) => {
                if (tooltip.style.display === 'block') {
                    tooltip.style.left = (e.clientX + 14) + 'px';
                    tooltip.style.top = (e.clientY + 14) + 'px';
                }
            });
            document.addEventListener('mouseout', (e) => {
                const hole = e.target.closest('.bolt-gauge-hole');
                const toEl = e.relatedTarget;
                if (hole && (!toEl || !toEl.closest || !toEl.closest('.bolt-gauge-hole'))) {
                    tooltip.style.display = 'none';
                }
            });
        }

        // ==========================================================
        // Filtrado de productos al hacer clic en un círculo de la regleta.
        //
        // Cada tarjeta de producto ya tiene una "etiqueta" (subcat-tag)
        // calculada por getLastWordTag(), que toma la ÚLTIMA palabra del
        // nombre del producto, por ejemplo:
        //   "TORNILLO HEX 6-9 GALV"      -> etiqueta "6-9"
        //   "TORNILLO CABEZA 1/4X47/64"  -> etiqueta "1/4X47/64"
        //
        // Al hacer clic en un círculo de la regleta (mm, calibre en
        // pulgada o fracción de pulgada), tomamos SOLO el primer valor de
        // esa etiqueta (antes del "-" o la "X") y lo comparamos con el
        // tamaño marcado en el círculo. Si coinciden, el producto se
        // muestra; si no, se oculta. El filtro se aplica a TODA la
        // categoría "TORNILLOS Y FIJACIONES", sin importar la subcategoría.
        // ==========================================================

        // Extrae el primer valor de una etiqueta: una fracción ("1/4"),
        // un decimal ("0.190") o un entero ("6"), ignorando lo que
        // venga después de un separador como "-", "X" o "x".
        function extractFirstTagValue(tag) {
            if (!tag) return null;
            const normalizedTag = String(tag).trim();
            // En milímetros se aceptan formatos como "M8", "8M" y "8-32",
            // pero nunca un número seguido de letras (por ejemplo "100PZ").
            // La unidad M se conserva en la etiqueta, pero el valor devuelto es numérico.
            const match = normalizedTag.match(/^(?:M)?(\d+\/\d+|\d+(?:\.\d+)?)(?:M)?(?=$|[-\sXx])/i);
            return match ? match[1] : null;
        }

        // Convierte ese primer valor a un número decimal comparable,
        // resolviendo fracciones (ej. "1/4" -> 0.25).
        function firstTagValueToDecimal(value) {
            if (value === null || value === undefined || value === '') return NaN;
            return String(value).includes('/') ? fractionToDecimal(value) : parseFloat(value);
        }

        // Estado del filtro de calibre actualmente activo (null si ninguno).
        let activeGaugeFilter = null; // { unit, value, displayLabel }

        // Se llama al hacer clic en cualquier círculo de la regleta.
        function handleGaugeHoleClick(circleEl) {
            const unit = circleEl.getAttribute('data-unit');
            const rawValue = circleEl.getAttribute('data-filter-value');
            const displayLabel = circleEl.getAttribute('data-display-label') || rawValue;
            const value = firstTagValueToDecimal(rawValue);

            const isSameSelection = activeGaugeFilter &&
                activeGaugeFilter.unit === unit &&
                Math.abs(activeGaugeFilter.value - value) < 0.001;

            document.querySelectorAll('.bolt-gauge-hole.active').forEach(c => c.classList.remove('active'));

            if (isSameSelection) {
                // Clic sobre el mismo círculo ya activo: se quita el filtro.
                activeGaugeFilter = null;
                clearGaugeFilter();
                return;
            }

            // Un filtro de calibre reemplaza cualquier filtro por etiqueta
            // de subcategoría que estuviera activo, para no combinar dos
            // criterios distintos a la vez.
            document.querySelectorAll('.subcat-tag.active').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.product-card.hidden-by-tag').forEach(c => c.classList.remove('hidden-by-tag'));

            circleEl.classList.add('active');
            activeGaugeFilter = { unit, value, displayLabel };
            applyGaugeFilter();
        }

        // Determina si una etiqueta (tag) coincide con el filtro de calibre
        // activo. Se usa tanto para las tarjetas de producto como para las
        // "etiquetas" (subcat-tag) que aparecen junto a cada subcategoría.
        // SIEMPRE se toma el PRIMER valor de la etiqueta (antes del "-" o
        // la "X"), nunca el último, vía extractFirstTagValue().
        // Busca el calibre numérico escrito entre paréntesis, por ejemplo
        // "ARANDELA PLANA USS (#10) 3/16X1/2" -> calibre #10.
        function extractParentheticalGauge(description) {
            const match = String(description || '').match(/\(\s*#\s*(\d+)\s*\)/i);
            return match ? Number(match[1]) : null;
        }

        // Equivalencias reales de los calibres numéricos de la regleta.
        // Se usan para reconocer productos que muestran únicamente el diámetro
        // en pulgadas, por ejemplo 3/16X1-1/4 para el calibre #10.
        function inchGaugeFractionForValue(value) {
            const gaugeFractions = {
                4: 7 / 64,
                5: 1 / 8,
                6: 9 / 64,
                8: 5 / 32,
                10: 3 / 16
            };
            const gauge = Object.keys(gaugeFractions).find(key =>
                Math.abs(Number(key) - value) < 0.01
            );
            return gauge ? gaugeFractions[gauge] : null;
        }

        function tagMatchesGaugeFilter(tag, unit, value, description = '', subcategory = '') {
            const normalizedSubcategory = String(subcategory || '').trim().toUpperCase();
            const isTorTecho = normalizedSubcategory.startsWith('TOR TECHO');
            // isTorCal ("tornillo calibre"): agrupa todos los tornillos cuya
            // medida se identifica por un calibre numérico en pulgadas
            // (#6, #8, #10, #12, #14...) en vez de milímetros o fracción
            // directa. Agregar aquí cualquier otro tornillo que deba
            // detectarse con esta misma lógica.
            const isTorCal = normalizedSubcategory.startsWith('TOR GYPSUM') ||
                normalizedSubcategory.startsWith('TOR K-LATH') ||
                normalizedSubcategory.startsWith('TOR LAMINA') ||
                normalizedSubcategory.startsWith('TOR MADERA') ||
                //normalizedSubcategory.startsWith('TOR ESTUFA') ||
                isTorTecho;

            // "Tor Gypsum", "Tor K-Lath", "Tor Lamina" y "Tor Techo":
            // el primer número de su etiqueta (6, 8, 10, 12, 14...) es
            // siempre un calibre en pulgadas (#6, #8, #10...), nunca
            // milímetros. Por eso nunca debe salir al hacer clic en un
            // círculo de milímetros, y sí debe salir al hacer clic en su
            // calibre exacto (#6, #8, #10, #12...) aunque la etiqueta sea un
            // entero sin fracción, como "6-9X1", "8-9X2-1/2" o "10X1" (p. ej.
            // "TOR LAMINA PHS 10X1" -> calibre #10).
            if (isTorCal) {
                const firstValue = extractFirstTagValue(tag);
                if (firstValue === null) return false;
                const firstDecimal = firstTagValueToDecimal(firstValue);

                if (unit === 'in-gauge') {
                    return Math.abs(firstDecimal - value) < 0.01;
                }

                // Caso especial del calibre #14: en la regleta la fila de
                // calibres numéricos solo llega hasta #12, pero #14
                // equivale en la práctica a 1/4", que sí existe como
                // agujero en la fila de fracciones. Aplica tanto a "Tor
                // Techo" (ver ejemplo "TOR TECHO ... 14") como a "Tor
                // Lamina" (ej. "TOR LAMINA PLANA PHS 14X1-1/4"). Por eso el
                // calibre #14 debe reconocerse también al hacer clic en el
                // agujero de 1/4".
                const isTorLamina = normalizedSubcategory.startsWith('TOR LAMINA');
                if ((isTorTecho || isTorLamina) && unit === 'in-fraction' && Math.abs(firstDecimal - 14) < 0.01) {
                    return Math.abs(value - 0.25) < 0.001;
                }

                return false;
            }

            // Los calibres numéricos se identifican exclusivamente por el
            // número entre paréntesis; no se debe confundir la longitud del
            // clavo ni una fracción de la descripción con su calibre.
            if (unit === 'in-gauge') {
                // Un calibre numérico puede venir indicado explícitamente entre
                // paréntesis (#10), pero también puede aparecer solo como su
                // diámetro equivalente en pulgadas (3/16X1-1/4). En ambos
                // casos debe encontrar el producto en la regleta.
                const parentheticalGauge = extractParentheticalGauge(description);
                if (parentheticalGauge !== null && Math.abs(parentheticalGauge - value) < 0.01) {
                    return true;
                }

                const firstGaugeValue = extractFirstTagValue(tag);
                if (!firstGaugeValue || !firstGaugeValue.includes('/')) return false;
                const gaugeFraction = inchGaugeFractionForValue(value);
                return gaugeFraction !== null &&
                    Math.abs(firstTagValueToDecimal(firstGaugeValue) - gaugeFraction) < 0.001;
            }

            const firstValueRaw = extractFirstTagValue(tag);
            if (firstValueRaw === null) return false;

            const hasSlash = firstValueRaw.includes('/');
            const isInteger = /^\d+$/.test(firstValueRaw);
            const firstValueDecimal = firstTagValueToDecimal(firstValueRaw);

            // La regleta superior representa milímetros enteros únicamente:
            // "M10", "10M" y "8-32" son válidos; "3/8" y "3.5" son pulgadas
            // o medidas fraccionarias, no calibre milimétrico. Las etiquetas como
            // "100PZ" ya fueron descartadas por extractFirstTagValue().
            if (unit === 'mm' && isInteger) {
                return Math.abs(firstValueDecimal - value) < 0.01;
            } else if (unit === 'in-fraction' && hasSlash) {
                return Math.abs(firstValueDecimal - value) < 0.001;
            }
            return false;
        }

        // Aplica (o vuelve a aplicar, por ejemplo tras recargar la lista de
        // productos) el filtro de calibre activo sobre todas las tarjetas,
        // así como sobre las etiquetas (subcat-tag) y los encabezados de
        // subcategoría / grids que queden sin ningún producto visible.
        function applyGaugeFilter() {
            if (!activeGaugeFilter) return;
            const { unit, value } = activeGaugeFilter;

            // Carga TODOS los productos pendientes (sin esperar el scroll)
            // para que el filtro de calibre se aplique sobre el catálogo
            // completo desde el primer clic, no solo sobre lo ya cargado.
            while (displayedCount < filteredProducts.length) {
                loadMoreProducts(true);
            }

            const allCards = document.querySelectorAll('.product-card[data-category]');
            const cards = Array.from(allCards).filter(card =>
                (card.getAttribute('data-category') || '').trim().toUpperCase() === 'TORNILLOS Y FIJACIONES'
            );

            cards.forEach(card => {
                // Los clavos se miden por longitud, no por calibre, por lo
                // que deben ocultarse mientras se consulta cualquier calibre.
                const subcategory = (card.getAttribute('data-subcategory') || '').trim().toUpperCase();
                if (subcategory.startsWith('CLAVO')) {
                    card.classList.add('hidden-by-gauge');
                    return;
                }

                const description = card.getAttribute('data-description') || '';
                const cardCategory = card.getAttribute('data-category') || '';
                const tag = getLastWordTag(description, cardCategory);
                const matches = tagMatchesGaugeFilter(tag, unit, value, description, subcategory);

                card.classList.toggle('hidden-by-gauge', !matches);
            });

            // Ahora propagamos el filtro a las etiquetas (subcat-tag) y a los
            // encabezados/grids de subcategoría: si una etiqueta no
            // pertenece al tamaño elegido, se oculta; y si TODAS las
            // etiquetas/tarjetas de una subcategoría quedan ocultas, se
            // oculta también su encabezado y su grid completos. Los CLAVOS
            // quedan siempre exentos, igual que sus tarjetas.
            document.querySelectorAll('.subcategory-header[data-group]').forEach(header => {
                const groupKey = header.getAttribute('data-group');
                const grid = document.querySelector(`.products-grid[data-group="${CSS.escape(groupKey)}"]`);
                if (!grid) return;

                const gridCards = Array.from(grid.querySelectorAll('.product-card'));
                const belongsToTornillos = gridCards.some(card =>
                    (card.getAttribute('data-category') || '').trim().toUpperCase() === 'TORNILLOS Y FIJACIONES'
                );
                if (!belongsToTornillos) return;

                header.querySelectorAll('.subcat-tag').forEach(tagEl => {
                    const tagValue = tagEl.getAttribute('data-tag') || tagEl.textContent;
                    const matchingCard = gridCards.find(card => getLastWordTag(
                        card.getAttribute('data-description') || '',
                        card.getAttribute('data-category') || ''
                    ) === tagValue);
                    const tagDescription = matchingCard ? (matchingCard.getAttribute('data-description') || '') : '';
                    const tagSubcategory = matchingCard ? (matchingCard.getAttribute('data-subcategory') || '') : '';
                    const matches = tagMatchesGaugeFilter(tagValue, unit, value, tagDescription, tagSubcategory);
                    tagEl.classList.toggle('hidden-by-gauge', !matches);
                });

                const hasVisibleCard = gridCards.some(card => !card.classList.contains('hidden-by-gauge'));
                header.classList.toggle('hidden-by-gauge', !hasVisibleCard);
                grid.classList.toggle('hidden-by-gauge', !hasVisibleCard);
            });
        }

        // Quita el filtro de calibre: vuelve a mostrar todas las tarjetas
        // ocultas por este filtro.
        function clearGaugeFilter() {
            document.querySelectorAll('.product-card.hidden-by-gauge').forEach(card => {
                card.classList.remove('hidden-by-gauge');
            });
            document.querySelectorAll('.subcat-tag.hidden-by-gauge').forEach(tagEl => {
                tagEl.classList.remove('hidden-by-gauge');
            });
            document.querySelectorAll('.subcategory-header.hidden-by-gauge').forEach(header => {
                header.classList.remove('hidden-by-gauge');
            });
            document.querySelectorAll('.products-grid.hidden-by-gauge').forEach(grid => {
                grid.classList.remove('hidden-by-gauge');
            });
        }

        // Botón "Quitar filtro" del banner.
        function clearGaugeFilterAndReset() {
            activeGaugeFilter = null;
            document.querySelectorAll('.bolt-gauge-hole.active').forEach(c => c.classList.remove('active'));
            clearGaugeFilter();
        }

        // Activa/desactiva la visibilidad de la regleta calibradora.
        // El diagrama solo existe en el DOM dentro de "TORNILLOS Y FIJACIONES",
        // así que aquí solo se alterna una clase en <body>.
        function toggleRulerGauge() {
            const isActive = document.body.classList.toggle('ruler-gauge-active');
            updateRulerToggleIcon(isActive);
            if (!isActive) {
                // Al ocultar la regleta, los círculos ya no son visibles,
                // así que también quitamos el filtro por calibre activo.
                clearGaugeFilterAndReset();
            }
            try {
                localStorage.setItem('catalogRulerGauge', isActive ? 'on' : 'off');
            } catch (e) {
                console.error('No se pudo guardar la preferencia de la regleta:', e);
            }
        }

        function updateRulerToggleIcon(isActive) {
            const btn = document.getElementById('ruler-toggle-btn');
            if (!btn) return;
            btn.classList.toggle('active', isActive);
            btn.title = isActive ? 'Ocultar regleta calibradora' : 'Mostrar regleta calibradora (solo en Tornillos y Fijaciones)';
        }

        // Restaura la preferencia guardada de la regleta calibradora
        (function initRulerMode() {
            let saved = null;
            try {
                saved = localStorage.getItem('catalogRulerGauge');
            } catch (e) {
                saved = null;
            }
            if (saved === 'on') {
                document.body.classList.add('ruler-gauge-active');
                updateRulerToggleIcon(true);
            } else {
                updateRulerToggleIcon(false);
            }
            setupBoltGaugeTooltip();
        })();
    </script>
</body>
</html>
